<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Drop-out Predictor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <h2>EduPredict AI</h2>
            <nav>
                <ul>
                    <li>Dashboard</li>
                    <li>Student Records</li>
                    <li>Risk Alerts</li>
                    <li>Settings</li>
                </ul>
            </nav>
        </aside>

        <main class="main-content">
            <header>
                <h1>Risk Assessment Dashboard</h1>
            </header>
            
            <section class="data-section">
                <table>
                    <thead>
                        <tr>
                            <th>Student Name</th>
                            <th>Attendance</th>
                            <th>Marks</th>
                            <th>AI Prediction</th>
                        </tr>
                    </thead>
                    <tbody id="student-list">
                        </tbody>
                </table>
            </section>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
